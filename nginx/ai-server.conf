# =============================================================================
# Nginx — AI Dev Server (HTTP)
# Para ativar HTTPS: sudo bash scripts/scripts.sh ssl seu.dominio.com email@
# =============================================================================

# Rate limiting apenas para as APIs (não para o WebUI — SPA carrega muitos assets em paralelo)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50M;

    # ── Open WebUI ────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Ollama API — Qwen2.5-Coder 7B ────────────────────────────────────
    location /ollama/ {
        limit_req zone=api burst=10 nodelay;
        rewrite ^/ollama/(.*) /$1 break;
        proxy_pass http://127.0.0.1:11434;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # ── llama.cpp API — Qwen3.6-35B-A3B ─────────────────────────────────
    location /qwen36/ {
        limit_req zone=api burst=5 nodelay;
        rewrite ^/qwen36/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}

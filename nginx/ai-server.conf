# =============================================================================
# Nginx — AI Dev Server
# Substitua "seu.dominio.com" pelo seu domínio real (ou use o IP)
# =============================================================================

# Rate limiting — proteção básica contra abuso
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=webui:10m rate=60r/m;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name seu.dominio.com;

    # Permite certbot renovar SSL
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS principal ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name seu.dominio.com;

    # Certificados SSL (gerados pelo Certbot)
    ssl_certificate     /etc/letsencrypt/live/seu.dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu.dominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Headers de segurança
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    client_max_body_size 50M;

    # ── Open WebUI (interface principal) ──────────────────────────────────
    location / {
        limit_req zone=webui burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ── Ollama API — Qwen2.5-Coder 7B ─────────────────────────────────────
    # Endpoint: https://seu.dominio.com/ollama/
    location /ollama/ {
        limit_req zone=api burst=10 nodelay;

        # Autenticação básica (adicione usuários com htpasswd)
        auth_basic "AI API";
        auth_basic_user_file /etc/nginx/.htpasswd;

        rewrite ^/ollama/(.*) /$1 break;
        proxy_pass http://127.0.0.1:11434;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;

        # Streaming (importante para LLMs)
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # ── llama.cpp API — Qwen3.6-35B-A3B ───────────────────────────────────
    # Endpoint: https://seu.dominio.com/qwen36/v1/
    # Compatível com OpenAI SDK
    location /qwen36/ {
        limit_req zone=api burst=5 nodelay;

        auth_basic "AI API";
        auth_basic_user_file /etc/nginx/.htpasswd;

        rewrite ^/qwen36/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;   # Qwen3.6 com /think pode demorar mais
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}

# ── Acesso direto por IP (sem domínio) ───────────────────────────────────────
# Remove este bloco quando tiver domínio configurado
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /ollama/ {
        rewrite ^/ollama/(.*) /$1 break;
        proxy_pass http://127.0.0.1:11434;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /qwen36/ {
        rewrite ^/qwen36/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8081;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
